name: Maintenance task
description: Track refactors, dependency work, CI updates, or operational cleanup.
title: "[Maintenance]: "
labels:
  - maintenance
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why is this maintenance needed now?
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Proposed plan
      description: List the implementation steps.
      placeholder: |
        - 
        -
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Describe the observed result.
      placeholder: |
        -
